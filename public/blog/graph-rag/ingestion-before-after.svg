<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sequential versus concurrent document ingestion</title><desc id="desc">The original single-document pipeline is contrasted with a Celery architecture that processes OCR, embeddings, graph extraction, and titles concurrently.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".1"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#273449" stroke-width="2"/></marker><style>.t{font:700 38px ui-rounded,"Comic Sans MS",sans-serif;fill:#111827}.h{font:700 25px ui-rounded,"Comic Sans MS",sans-serif}.b{font:18px ui-rounded,"Comic Sans MS",sans-serif;fill:#344054}.sm{font:16px ui-rounded,"Comic Sans MS",sans-serif;fill:#667085}.box{stroke-width:3;filter:url(#s)}.arr{fill:none;stroke:#273449;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="#fffdf9"/><text x="800" y="72" text-anchor="middle" class="t">The ingestion bottleneck—and the architecture that removed it</text>
  <rect x="54" y="128" width="620" height="712" rx="30" fill="#fff7f7" stroke="#ef4444" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="364" y="184" text-anchor="middle" class="h" fill="#b91c1c">BEFORE · ONE DOCUMENT AT A TIME</text>
  <g class="box"><rect x="105" y="238" width="184" height="78" rx="18" fill="#fff" stroke="#ef4444"/><rect x="105" y="342" width="184" height="78" rx="18" fill="#fff" stroke="#ef4444"/><rect x="105" y="446" width="184" height="78" rx="18" fill="#fff" stroke="#ef4444"/><rect x="105" y="550" width="184" height="78" rx="18" fill="#fff" stroke="#ef4444"/></g>
  <text x="197" y="286" text-anchor="middle" class="h" fill="#991b1b">PDF 1</text><text x="197" y="390" text-anchor="middle" class="h" fill="#9ca3af">PDF 2</text><text x="197" y="494" text-anchor="middle" class="h" fill="#9ca3af">PDF 3</text><text x="197" y="598" text-anchor="middle" class="h" fill="#9ca3af">… 22,000</text>
  <path class="arr" d="M292 277 C324 277 334 277 362 277"/><rect class="box" x="368" y="222" width="246" height="110" rx="20" fill="#fff" stroke="#f97316"/><text x="491" y="266" text-anchor="middle" class="h" fill="#c2410c">Full pipeline</text><text x="491" y="299" text-anchor="middle" class="b">OCR → embed → graph</text>
  <path d="M491 338 C491 422 491 490 491 571" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/><text x="491" y="620" text-anchor="middle" class="h" fill="#b91c1c">Everyone waits</text>
  <text x="364" y="734" text-anchor="middle" class="b">One slow OCR or graph task blocks the next file.</text><text x="364" y="770" text-anchor="middle" class="b">Throughput is limited by the slowest stage.</text>

  <rect x="720" y="128" width="826" height="712" rx="30" fill="#f5fbff" stroke="#3b82f6" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="1133" y="184" text-anchor="middle" class="h" fill="#1d4ed8">AFTER · CONCURRENT CELERY PIPELINE</text>
  <rect class="box" x="766" y="266" width="190" height="124" rx="22" fill="#fff7ed" stroke="#f97316"/><text x="861" y="310" text-anchor="middle" class="h" fill="#c2410c">Redis</text><text x="861" y="344" text-anchor="middle" class="b">broker + results</text><text x="861" y="372" text-anchor="middle" class="sm">dispatch · retry</text>
  <g><circle cx="800" cy="480" r="29" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><circle cx="861" cy="480" r="29" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><circle cx="922" cy="480" r="29" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><text x="861" y="535" text-anchor="middle" class="sm">many PDFs in flight</text></g>
  <path class="arr" d="M861 447 C861 427 861 414 861 394"/>
  <path class="arr" d="M960 304 C1000 270 1018 250 1052 250"/><path class="arr" d="M960 326 C1000 326 1018 326 1052 326"/><path class="arr" d="M960 350 C1000 386 1018 402 1052 402"/><path class="arr" d="M960 372 C1000 450 1018 478 1052 478"/>
  <rect class="box" x="1058" y="214" width="226" height="64" rx="17" fill="#eef7ff" stroke="#3b82f6"/><text x="1171" y="254" text-anchor="middle" class="h" fill="#1d4ed8">OCR × 3</text>
  <rect class="box" x="1058" y="294" width="226" height="64" rx="17" fill="#ecfdf5" stroke="#22c55e"/><text x="1171" y="334" text-anchor="middle" class="h" fill="#15803d">Vectors × 6</text>
  <rect class="box" x="1058" y="374" width="226" height="64" rx="17" fill="#fff7ed" stroke="#f59e0b"/><text x="1171" y="414" text-anchor="middle" class="h" fill="#b45309">Graph × 3</text>
  <rect class="box" x="1058" y="454" width="226" height="64" rx="17" fill="#fdf2f8" stroke="#ec4899"/><text x="1171" y="494" text-anchor="middle" class="h" fill="#be185d">Titles × 2</text>
  <path class="arr" d="M1288 326 C1322 326 1340 326 1370 326"/><path class="arr" d="M1288 406 C1322 406 1340 406 1370 406"/>
  <rect class="box" x="1374" y="274" width="128" height="82" rx="18" fill="#ecfeff" stroke="#06b6d4"/><text x="1438" y="324" text-anchor="middle" class="h" fill="#0e7490">Qdrant</text>
  <rect class="box" x="1374" y="376" width="128" height="82" rx="18" fill="#eef2ff" stroke="#6366f1"/><text x="1438" y="426" text-anchor="middle" class="h" fill="#4338ca">Neo4j</text>
  <rect x="792" y="604" width="636" height="128" rx="22" fill="#fff" stroke="#22c55e" stroke-width="3"/>
  <text x="1110" y="648" text-anchor="middle" class="h" fill="#15803d">The queues become scaling boundaries</text><text x="1110" y="685" text-anchor="middle" class="b">Tune each stage independently. Retry only failed work.</text><text x="1110" y="716" text-anchor="middle" class="b">Keep multiple documents moving at the same time.</text>
</svg>
