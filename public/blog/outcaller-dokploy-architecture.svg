<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">OutCallerAI production deployment architecture</title>
  <desc id="desc">A push to main triggers GitHub Actions, which builds three images and pushes them to GHCR. Dokploy on a DigitalOcean Droplet pulls those images and runs the Next.js web app, FastAPI API, and Prefect workers behind Traefik. The API and workers connect securely to DigitalOcean Managed PostgreSQL, while Prefect workers communicate with a self-hosted Prefect server.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#111a32"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
    <style>
      .title{font:700 34px ui-sans-serif,system-ui,sans-serif;fill:#f8fafc}.sub{font:400 17px ui-sans-serif,system-ui,sans-serif;fill:#94a3b8}.label{font:700 20px ui-sans-serif,system-ui,sans-serif;fill:#f8fafc}.small{font:400 15px ui-sans-serif,system-ui,sans-serif;fill:#cbd5e1}.tiny{font:600 13px ui-sans-serif,system-ui,sans-serif;fill:#94a3b8;letter-spacing:.08em}.box{fill:#17213b;stroke:#334155;stroke-width:2}.flow{fill:none;stroke:#94a3b8;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="900" rx="28" fill="url(#bg)"/>
  <rect x="64" y="54" width="8" height="64" rx="4" fill="url(#accent)"/>
  <text x="94" y="82" class="title">From git push to production</text>
  <text x="94" y="110" class="sub">OutCallerAI: build off-server, deploy pre-built containers, route everything through Traefik</text>

  <g filter="url(#shadow)"><rect class="box" x="70" y="205" width="230" height="132" rx="18"/><text x="95" y="242" class="tiny">SOURCE</text><text x="95" y="278" class="label">GitHub</text><text x="95" y="306" class="small">Push or merge to main</text></g>
  <path class="flow" d="M300 271 H380"/><text x="319" y="254" class="tiny">TRIGGER</text>
  <g filter="url(#shadow)"><rect class="box" x="390" y="175" width="290" height="192" rx="18"/><text x="415" y="212" class="tiny">CI — GITHUB ACTIONS</text><text x="415" y="248" class="label">Build in parallel</text><text x="415" y="281" class="small">Next.js web image</text><text x="415" y="309" class="small">FastAPI image</text><text x="415" y="337" class="small">Prefect worker image</text></g>
  <path class="flow" d="M680 271 H760"/><text x="697" y="254" class="tiny">PUSH</text>
  <g filter="url(#shadow)"><rect class="box" x="770" y="205" width="250" height="132" rx="18"/><text x="795" y="242" class="tiny">ARTIFACTS</text><text x="795" y="278" class="label">GitHub GHCR</text><text x="795" y="306" class="small">SHA + production tags</text></g>
  <path class="flow" d="M1020 271 H1100"/><text x="1036" y="254" class="tiny">PULL</text>
  <g filter="url(#shadow)"><rect class="box" x="1110" y="175" width="260" height="192" rx="18"/><text x="1135" y="212" class="tiny">CD — DOKPLOY</text><text x="1135" y="248" class="label">Deploy webhook</text><text x="1135" y="281" class="small">Pull fresh images</text><text x="1135" y="309" class="small">Restart services</text><text x="1135" y="337" class="small">Health-check containers</text></g>

  <rect x="70" y="435" width="1300" height="380" rx="24" fill="#10182e" stroke="#334155" stroke-width="2"/>
  <text x="98" y="476" class="tiny">DIGITALOCEAN DROPLET — DOKPLOY + DOCKER</text>
  <g filter="url(#shadow)"><rect class="box" x="105" y="525" width="250" height="210" rx="18"/><text x="130" y="562" class="tiny">EDGE</text><text x="130" y="599" class="label">Traefik</text><text x="130" y="632" class="small">Host-based routing</text><text x="130" y="660" class="small">HTTPS certificates</text><text x="130" y="688" class="small">Ports 80 and 443</text></g>
  <g filter="url(#shadow)"><rect class="box" x="450" y="510" width="270" height="96" rx="18"/><text x="475" y="546" class="tiny">WEB · :3001</text><text x="475" y="580" class="label">Next.js</text></g>
  <g filter="url(#shadow)"><rect class="box" x="450" y="635" width="270" height="96" rx="18"/><text x="475" y="671" class="tiny">API · :8180</text><text x="475" y="705" class="label">FastAPI + Prisma</text></g>
  <g filter="url(#shadow)"><rect class="box" x="810" y="510" width="270" height="96" rx="18"/><text x="835" y="546" class="tiny">ORCHESTRATION · :4200</text><text x="835" y="580" class="label">Prefect server</text></g>
  <g filter="url(#shadow)"><rect class="box" x="810" y="635" width="270" height="96" rx="18"/><text x="835" y="671" class="tiny">BACKGROUND EXECUTION</text><text x="835" y="705" class="label">Prefect workers</text></g>
  <g filter="url(#shadow)"><rect x="1160" y="525" width="175" height="210" rx="18" fill="#17213b" stroke="#f59e0b" stroke-width="2"/><text x="1185" y="562" class="tiny">MANAGED DATA</text><text x="1185" y="599" class="label">PostgreSQL</text><text x="1185" y="632" class="small">TLS connection</text><text x="1185" y="660" class="small">Backups + PITR</text><text x="1185" y="688" class="small">Outside the VPS</text></g>
  <path class="flow" d="M355 574 H440"/><path class="flow" d="M355 670 H440"/><path class="flow" d="M720 682 H800"/><path class="flow" d="M945 635 V616"/><path class="flow" d="M1080 683 H1150"/><path class="flow" d="M720 683 C760 760 1110 760 1150 690"/>
  <text x="72" y="858" class="sub">DNS points public hostnames to the Droplet. Traefik routes each hostname to its container; application data lives in managed PostgreSQL.</text>
</svg>
