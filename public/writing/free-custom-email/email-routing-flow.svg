<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1f2937" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#253047" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .title{font:700 38px ui-rounded,"Comic Sans MS",sans-serif;fill:#111827}
      .sub{font:20px ui-rounded,"Comic Sans MS",sans-serif;fill:#4b5563}
      .label{font:700 21px ui-rounded,"Comic Sans MS",sans-serif}
      .body{font:18px ui-rounded,"Comic Sans MS",sans-serif;fill:#253047}
      .tiny{font:16px ui-rounded,"Comic Sans MS",sans-serif;fill:#4b5563}
      .box{stroke-width:3;filter:url(#shadow)}
      .arrow{fill:none;stroke:#253047;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="780" fill="#fffdf9"/>
  <text x="800" y="68" text-anchor="middle" class="title">Send and receive as hi@yourdomain.com for $0</text>
  <text x="800" y="106" text-anchor="middle" class="sub">Cloudflare routes inbound mail to Gmail; Gmail SMTP + App Password sends replies back</text>

  <!-- Receive Path -->
  <rect x="64" y="156" width="1472" height="252" rx="30" fill="#fff7ed" stroke="#f97316" stroke-dasharray="13 11" stroke-width="2.5"/>
  <text x="96" y="198" class="label" fill="#c2410c">INBOUND · CLOUDFLARE EMAIL ROUTING (FREE)</text>

  <rect class="box" x="104" y="232" width="280" height="132" rx="22" fill="#fff" stroke="#64748b"/>
  <text x="244" y="280" text-anchor="middle" class="label" fill="#0f172a">Recruiter / Client</text>
  <text x="244" y="316" text-anchor="middle" class="body">Emails hi@yourdomain.com</text>
  <text x="244" y="344" text-anchor="middle" class="tiny">looks like a custom inbox</text>

  <path class="arrow" d="M388 298 L476 298"/>

  <rect class="box" x="484" y="232" width="320" height="132" rx="22" fill="#fff" stroke="#ea580c"/>
  <text x="644" y="280" text-anchor="middle" class="label" fill="#c2410c">Cloudflare Nameservers</text>
  <text x="644" y="316" text-anchor="middle" class="body">MX + SPF/TXT records</text>
  <text x="644" y="344" text-anchor="middle" class="tiny">site CNAME stays untouched</text>

  <path class="arrow" d="M808 298 L896 298"/>

  <rect class="box" x="904" y="232" width="270" height="132" rx="22" fill="#fff" stroke="#f97316"/>
  <text x="1039" y="280" text-anchor="middle" class="label" fill="#ea580c">Routing Rule</text>
  <text x="1039" y="316" text-anchor="middle" class="body">hi@ → personal Gmail</text>
  <text x="1039" y="344" text-anchor="middle" class="tiny">forwards automatically</text>

  <path class="arrow" d="M1178 298 L1246 298"/>

  <rect class="box" x="1254" y="232" width="242" height="132" rx="22" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="1375" y="280" text-anchor="middle" class="label" fill="#15803d">Your Gmail Inbox</text>
  <text x="1375" y="316" text-anchor="middle" class="body">Reads in normal Gmail</text>
  <text x="1375" y="344" text-anchor="middle" class="tiny">no extra mailbox app</text>

  <!-- Send Path -->
  <rect x="64" y="452" width="1472" height="252" rx="30" fill="#f7fbff" stroke="#3b82f6" stroke-dasharray="13 11" stroke-width="2.5"/>
  <text x="96" y="494" class="label" fill="#1d4ed8">OUTBOUND · GMAIL "SEND MAIL AS" + APP PASSWORD</text>

  <rect class="box" x="104" y="528" width="380" height="132" rx="22" fill="#fff" stroke="#2563eb"/>
  <text x="294" y="576" text-anchor="middle" class="label" fill="#1d4ed8">1. Google App Password</text>
  <text x="294" y="612" text-anchor="middle" class="body">16-char SMTP password</text>
  <text x="294" y="640" text-anchor="middle" class="tiny">requires 2-Step Verification</text>

  <path class="arrow" d="M488 594 L578 594"/>

  <rect class="box" x="586" y="528" width="420" height="132" rx="22" fill="#fff" stroke="#6366f1"/>
  <text x="796" y="576" text-anchor="middle" class="label" fill="#4338ca">2. Gmail SMTP (Port 587 TLS)</text>
  <text x="796" y="612" text-anchor="middle" class="body">smtp.gmail.com · uncheck "alias"</text>
  <text x="796" y="640" text-anchor="middle" class="tiny">verify via code sent to hi@yourdomain.com</text>

  <path class="arrow" d="M1010 594 L1100 594"/>

  <rect class="box" x="1108" y="528" width="388" height="132" rx="22" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="1302" y="576" text-anchor="middle" class="label" fill="#15803d">3. Default Custom Sender</text>
  <text x="1302" y="612" text-anchor="middle" class="body">Every reply sends from</text>
  <text x="1302" y="640" text-anchor="middle" class="tiny">hi@yourdomain.com ($0/mo)</text>
</svg>