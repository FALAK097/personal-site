<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive Graph RAG query flow</title><desc id="desc">A query is summarized and analyzed, routed through vector or graph retrieval, checked for sufficiency, adaptively reranked, and streamed as a cited answer.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".1"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#273449" stroke-width="2"/></marker><style>.t{font:700 38px ui-rounded,"Comic Sans MS",sans-serif;fill:#111827}.h{font:700 22px ui-rounded,"Comic Sans MS",sans-serif}.b{font:17px ui-rounded,"Comic Sans MS",sans-serif;fill:#475467}.box{stroke-width:3;filter:url(#s)}.arr{fill:none;stroke:#273449;stroke-width:3;stroke-linecap:round;marker-end:url(#a)}.dash{fill:none;stroke:#8b5cf6;stroke-width:3;stroke-dasharray:10 9;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="980" fill="#fffdf9"/><text x="800" y="68" text-anchor="middle" class="t">The query path does less work when the evidence is already good</text>
  <rect class="box" x="74" y="128" width="220" height="94" rx="22" fill="#f5f3ff" stroke="#8b5cf6"/><text x="184" y="169" text-anchor="middle" class="h" fill="#6d28d9">User question</text><text x="184" y="198" text-anchor="middle" class="b">plus chat history</text>
  <path class="arr" d="M298 175 C330 175 344 175 374 175"/><rect class="box" x="378" y="128" width="230" height="94" rx="22" fill="#eef7ff" stroke="#3b82f6"/><text x="493" y="164" text-anchor="middle" class="h" fill="#1d4ed8">Summarize + analyze</text><text x="493" y="194" text-anchor="middle" class="b">rewrite · clarify · split</text>
  <path class="arr" d="M612 175 C644 175 658 175 688 175"/><rect class="box" x="692" y="128" width="230" height="94" rx="22" fill="#fff7ed" stroke="#f97316"/><text x="807" y="164" text-anchor="middle" class="h" fill="#c2410c">Route retrieval</text><text x="807" y="194" text-anchor="middle" class="b">vector · graph · both</text>
  <path class="arr" d="M926 175 C958 175 972 175 1002 175"/><rect class="box" x="1006" y="112" width="240" height="126" rx="22" fill="#ecfeff" stroke="#06b6d4"/><text x="1126" y="154" text-anchor="middle" class="h" fill="#0e7490">Qdrant</text><text x="1126" y="184" text-anchor="middle" class="b">semantic passages</text><text x="1126" y="214" text-anchor="middle" class="b">KaLM query vector</text>
  <path class="arr" d="M926 196 C958 255 972 286 1002 304"/><rect class="box" x="1006" y="264" width="240" height="110" rx="22" fill="#eef2ff" stroke="#6366f1"/><text x="1126" y="307" text-anchor="middle" class="h" fill="#4338ca">Neo4j</text><text x="1126" y="338" text-anchor="middle" class="b">entities + relationships</text>
  <path class="arr" d="M1250 175 C1290 175 1300 227 1332 246"/><path class="arr" d="M1250 319 C1290 319 1300 278 1332 260"/>
  <rect class="box" x="1336" y="210" width="196" height="98" rx="22" fill="#fff" stroke="#22c55e"/><text x="1434" y="249" text-anchor="middle" class="h" fill="#15803d">Merge evidence</text><text x="1434" y="279" text-anchor="middle" class="b">with source metadata</text>
  <path class="arr" d="M1434 312 C1434 350 1434 366 1434 398"/><rect class="box" x="1308" y="402" width="252" height="108" rx="22" fill="#fff7ed" stroke="#f59e0b"/><text x="1434" y="444" text-anchor="middle" class="h" fill="#b45309">Sufficient evidence?</text><text x="1434" y="476" text-anchor="middle" class="b">score against threshold</text>
  <path class="dash" d="M1304 456 C1190 456 1152 426 1116 382"/><text x="1192" y="437" text-anchor="middle" class="h" fill="#6d28d9">NO · rewrite once</text>
  <path class="arr" d="M1434 514 C1434 552 1434 568 1434 600"/><text x="1461" y="559" class="h" fill="#15803d">YES</text>
  <rect class="box" x="1290" y="604" width="288" height="110" rx="22" fill="#ecfdf5" stroke="#22c55e"/><text x="1434" y="646" text-anchor="middle" class="h" fill="#15803d">Assess retrieval quality</text><text x="1434" y="678" text-anchor="middle" class="b">choose reranking cost</text>
  <path class="arr" d="M1290 659 C1234 659 1216 659 1170 659"/>
  <rect class="box" x="884" y="584" width="280" height="150" rx="22" fill="#fff" stroke="#ec4899"/><text x="1024" y="622" text-anchor="middle" class="h" fill="#be185d">Adaptive reranking</text><text x="1024" y="656" text-anchor="middle" class="b">high quality → skip</text><text x="1024" y="686" text-anchor="middle" class="b">medium → reduced</text><text x="1024" y="716" text-anchor="middle" class="b">low → full</text>
  <path class="arr" d="M880 659 C840 659 824 659 788 659"/><rect class="box" x="532" y="604" width="252" height="110" rx="22" fill="#f5f3ff" stroke="#8b5cf6"/><text x="658" y="646" text-anchor="middle" class="h" fill="#6d28d9">Build context</text><text x="658" y="678" text-anchor="middle" class="b">bounded history + evidence</text>
  <path class="arr" d="M528 659 C488 659 474 659 440 659"/><rect class="box" x="172" y="604" width="264" height="110" rx="22" fill="#fff7ed" stroke="#f97316"/><text x="304" y="646" text-anchor="middle" class="h" fill="#c2410c">Self-hosted LLM</text><text x="304" y="678" text-anchor="middle" class="b">generate grounded answer</text>
  <path class="arr" d="M304 718 C304 756 304 772 304 804"/><rect class="box" x="128" y="808" width="352" height="116" rx="24" fill="#ecfdf5" stroke="#22c55e"/><text x="304" y="852" text-anchor="middle" class="h" fill="#15803d">Stream answer immediately</text><text x="304" y="884" text-anchor="middle" class="b">inline citations · sources · trace ID</text>
  <rect x="568" y="804" width="876" height="120" rx="24" fill="#fff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="11 9"/><text x="1006" y="848" text-anchor="middle" class="h" fill="#374151">Fast paths are deliberate</text><text x="1006" y="882" text-anchor="middle" class="b">Do not query every store, rerank every result, or repeat retrieval unless quality requires it.</text>
</svg>
