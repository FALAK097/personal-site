  <path class="arr" d="M312 285 C342 285 356 285 384 285"/><rect class="box" x="388" y="222" width="224" height="126" rx="22" fill="#fff7ed" stroke="#f97316"/><text x="500" y="265" text-anchor="middle" class="h" fill="#c2410c">Source metadata</text><text x="500" y="297" text-anchor="middle" class="b">title · file · page</text><text x="500" y="325" text-anchor="middle" class="b">quoted passage</text>
  <path class="arr" d="M616 285 C646 285 660 285 688 285"/><rect class="box" x="692" y="222" width="224" height="126" rx="22" fill="#ecfdf5" stroke="#22c55e"/><text x="804" y="265" text-anchor="middle" class="h" fill="#15803d">Signed PDF</text><text x="804" y="297" text-anchor="middle" class="b">time-limited URL</text><text x="804" y="325" text-anchor="middle" class="b">jump to cited page</text>
