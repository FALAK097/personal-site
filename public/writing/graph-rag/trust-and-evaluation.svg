<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Evidence experience and evaluation loop</title><desc id="desc">The upper flow connects an inline citation to a signed PDF and a RapidOCR highlight. The lower flow connects production traces and user feedback to RAGAS and golden dataset evaluation.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".1"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#273449" stroke-width="2"/></marker><style>.t{font:700 38px ui-rounded,"Comic Sans MS",sans-serif;fill:#111827}.h{font:700 22px ui-rounded,"Comic Sans MS",sans-serif}.b{font:17px ui-rounded,"Comic Sans MS",sans-serif;fill:#475467}.box{stroke-width:3;filter:url(#s)}.arr{fill:none;stroke:#273449;stroke-width:3;stroke-linecap:round;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="920" fill="#fffdf9"/><text x="800" y="68" text-anchor="middle" class="t">Trust is built twice: in the interface and in evaluation</text>
  <rect x="54" y="120" width="1492" height="322" rx="30" fill="#f8fbff" stroke="#3b82f6" stroke-width="3" stroke-dasharray="13 10"/><text x="84" y="164" class="h" fill="#1d4ed8">THE ANSWER-TO-EVIDENCE EXPERIENCE</text>
