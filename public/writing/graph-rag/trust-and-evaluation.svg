  <path class="arr" d="M1224 285 C1254 285 1268 285 1296 285"/><rect class="box" x="1300" y="222" width="214" height="126" rx="22" fill="#fffbea" stroke="#eab308"/><text x="1407" y="265" text-anchor="middle" class="h" fill="#a16207">Exact highlight</text><text x="1407" y="297" text-anchor="middle" class="b">merged word boxes</text><text x="1407" y="325" text-anchor="middle" class="b">react-pdf overlay</text>

