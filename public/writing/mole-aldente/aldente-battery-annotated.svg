<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1f2937" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#253047" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .title{font:700 36px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;fill:#111827}
      .sub{font:19px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;fill:#4b5563}
      .hdr{font:700 17px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;letter-spacing:0.4px}
      .label{font:700 20px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
      .body{font:17.5px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;fill:#253047}
      .tiny{font:15.5px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;fill:#4b5563}
      .box{stroke-width:3;filter:url(#shadow)}
      .arrow{fill:none;stroke:#253047;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="720" fill="#fffdf9"/>
  <text x="800" y="66" text-anchor="middle" class="title">Desk charging without cooking your MacBook battery</text>
  <text x="800" y="102" text-anchor="middle" class="sub">Hold an 80% hardware limit on plugged-in desk days; top up to 100% only before travel</text>

  <!-- Left: Uncapped -->
  <rect x="64" y="152" width="690" height="496" rx="30" fill="#fef2f2" stroke="#ef4444" stroke-dasharray="13 11" stroke-width="2.5"/>
  <text x="98" y="194" class="hdr" fill="#dc2626">WITHOUT ALDENTE (DEFAULT MACOS)</text>

  <rect class="box" x="104" y="226" width="610" height="128" rx="22" fill="#fff" stroke="#ef4444"/>
  <text x="409" y="270" text-anchor="middle" class="label" fill="#b91c1c">Pinned at 100% All Week</text>
  <rect x="148" y="292" width="522" height="24" rx="12" fill="#fee2e2"/>
  <rect x="148" y="292" width="522" height="24" rx="12" fill="#ef4444"/>
  <text x="409" y="338" text-anchor="middle" class="tiny">100% high-voltage state on external power</text>

  <path class="arrow" d="M409 356 L409 412"/>

  <rect class="box" x="104" y="420" width="610" height="186" rx="22" fill="#fff" stroke="#ef4444"/>
  <text x="409" y="464" text-anchor="middle" class="label" fill="#b91c1c">Heat + Voltage Wear Accelerates</text>
  <text x="409" y="504" text-anchor="middle" class="body">• Optimized Charging misses irregular dev schedules</text>
  <text x="409" y="538" text-anchor="middle" class="body">• Docker, Next.js builds &amp; agents heat warm cells</text>
  <text x="409" y="572" text-anchor="middle" class="body">• Faster long-term maximum capacity drop</text>

  <!-- Right: With AlDente -->
  <rect x="846" y="152" width="690" height="496" rx="30" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="13 11" stroke-width="2.5"/>
  <text x="880" y="194" class="hdr" fill="#15803d">WITH ALDENTE (DESK + TRAVEL WORKFLOW)</text>

  <rect class="box" x="886" y="226" width="610" height="128" rx="22" fill="#fff" stroke="#16a34a"/>
  <text x="1191" y="270" text-anchor="middle" class="label" fill="#166534">Capped at 80% Charge Limit</text>
  <rect x="930" y="292" width="522" height="24" rx="12" fill="#dcfce7"/>
  <rect x="930" y="292" width="418" height="24" rx="12" fill="#16a34a"/>
  <text x="1191" y="338" text-anchor="middle" class="tiny">80% sweet spot · adapter powers system directly</text>

  <path class="arrow" d="M1191 356 L1191 412"/>

  <rect class="box" x="886" y="420" width="610" height="186" rx="22" fill="#fff" stroke="#16a34a"/>
  <text x="1191" y="464" text-anchor="middle" class="label" fill="#166534">Three Practical Controls</text>
  <text x="1191" y="504" text-anchor="middle" class="body">• Heat Protection pauses charging during heavy builds</text>
  <text x="1191" y="538" text-anchor="middle" class="body">• One-click top up to 100% before travel days</text>
  <text x="1191" y="572" text-anchor="middle" class="body">• Monthly full calibration keeps % readout accurate</text>
</svg>