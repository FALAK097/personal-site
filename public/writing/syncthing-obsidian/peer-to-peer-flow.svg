<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
  <title id="title">Syncthing peer-to-peer Obsidian sync</title>
  <desc id="description">A laptop and a second device exchange an Obsidian vault directly through Syncthing. A crossed-out cloud shows that no central storage provider holds the vault.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#f0f9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="blueArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect width="1400" height="760" rx="36" fill="url(#bg)"/>
  <text x="700" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="800" fill="#0f172a">Your vault stays on your devices</text>
  <text x="700" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#475569">Syncthing discovers peers, encrypts transport, and synchronises changed files directly.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="200" width="410" height="390" rx="28" fill="white" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="900" y="200" width="410" height="390" rx="28" fill="white" stroke="#cbd5e1" stroke-width="3"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="170" y="260" width="250" height="150" rx="16" fill="#0f172a"/>
    <rect x="194" y="284" width="202" height="106" rx="6" fill="#e0f2fe"/>
    <path d="M142 430 H448 L410 470 H180 Z" fill="#334155"/>
    <text x="295" y="528" text-anchor="middle" font-size="30" font-weight="750" fill="#0f172a">Laptop</text>
    <text x="295" y="565" text-anchor="middle" font-size="23" fill="#64748b">Obsidian vault + Syncthing</text>

    <rect x="1012" y="246" width="186" height="262" rx="30" fill="#0f172a"/>
    <rect x="1029" y="282" width="152" height="192" rx="12" fill="#e0f2fe"/>
    <circle cx="1105" cy="489" r="8" fill="#94a3b8"/>
    <text x="1105" y="548" text-anchor="middle" font-size="30" font-weight="750" fill="#0f172a">Second device</text>
    <text x="1105" y="582" text-anchor="middle" font-size="22" fill="#64748b">Computer or supported mobile app</text>
  </g>

  <g fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round">
    <path d="M500 322 C640 238 760 238 900 322" marker-end="url(#blueArrow)"/>
    <path d="M900 456 C760 540 640 540 500 456" marker-end="url(#blueArrow)"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <rect x="572" y="257" width="256" height="58" rx="29" fill="#0284c7"/>
    <text x="700" y="296" font-size="25" font-weight="750" fill="white">Encrypted transfer</text>
    <rect x="594" y="470" width="212" height="58" rx="29" fill="#0284c7"/>
    <text x="700" y="509" font-size="25" font-weight="750" fill="white">Changed files</text>
  </g>

  <g transform="translate(610 590)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <path d="M34 70 C16 70 2 57 2 40 C2 24 14 12 30 10 C38 -2 52 -8 66 -4 C79 0 88 9 91 22 C108 20 122 33 122 49 C122 61 112 70 99 70 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
    <path d="M4 0 L122 92" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/>
    <text x="146" y="51" font-size="25" font-weight="700" fill="#7f1d1d">No central cloud copy</text>
  </g>
</svg>
