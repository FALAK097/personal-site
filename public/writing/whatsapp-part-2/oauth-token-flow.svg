<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1f2937" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#253047" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .title{font:700 38px ui-rounded,"Comic Sans MS",sans-serif;fill:#111827}
      .sub{font:20px ui-rounded,"Comic Sans MS",sans-serif;fill:#4b5563}
      .label{font:700 21px ui-rounded,"Comic Sans MS",sans-serif}
      .body{font:18px ui-rounded,"Comic Sans MS",sans-serif;fill:#253047}
      .tiny{font:16px ui-rounded,"Comic Sans MS",sans-serif;fill:#4b5563}
      .box{stroke-width:3;filter:url(#shadow)}
      .arrow{fill:none;stroke:#253047;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="740" fill="#fffdf9"/>
  <text x="800" y="68" text-anchor="middle" class="title">Multi-tenant WhatsApp OAuth 2.0 token flow</text>
  <text x="800" y="106" text-anchor="middle" class="sub">From user consent to 60-day tokens, WABA discovery, and signed webhooks</text>

  <rect x="64" y="152" width="1472" height="252" rx="30" fill="#f0fdf4" stroke="#10b981" stroke-dasharray="13 11" stroke-width="2.5"/>
  <text x="96" y="194" class="label" fill="#047857">STEP 1–4 · BROWSER CONSENT → AUTHORIZATION CODE</text>

  <rect class="box" x="104" y="226" width="290" height="134" rx="22" fill="#fff" stroke="#0f172a"/>
  <text x="249" y="274" text-anchor="middle" class="label" fill="#0f172a">1. Connect Button</text>
  <text x="249" y="308" text-anchor="middle" class="body">POST /oauth/connect</text>
  <text x="249" y="336" text-anchor="middle" class="tiny">generates CSRF state</text>

  <path class="arrow" d="M398 293 L474 293"/>

  <rect class="box" x="482" y="226" width="320" height="134" rx="22" fill="#fff" stroke="#2563eb"/>
  <text x="642" y="274" text-anchor="middle" class="label" fill="#1d4ed8">2. Meta OAuth Portal</text>
  <text x="642" y="308" text-anchor="middle" class="body">config_id permissions</text>
  <text x="642" y="336" text-anchor="middle" class="tiny">user selects WABA + phone</text>

  <path class="arrow" d="M806 293 L882 293"/>

  <rect class="box" x="890" y="226" width="290" height="134" rx="22" fill="#fff" stroke="#0d9488"/>
  <text x="1035" y="274" text-anchor="middle" class="label" fill="#0f766e">3. Callback Route</text>
  <text x="1035" y="308" text-anchor="middle" class="body">Receives temp code</text>
  <text x="1035" y="336" text-anchor="middle" class="tiny">verifies state + session</text>

  <path class="arrow" d="M1184 293 L1254 293"/>

  <rect class="box" x="1262" y="226" width="234" height="134" rx="22" fill="#fff7ed" stroke="#ea580c"/>
  <text x="1379" y="274" text-anchor="middle" class="label" fill="#c2410c">4. Short Token</text>
  <text x="1379" y="308" text-anchor="middle" class="body">oauth/access_token</text>
  <text x="1379" y="336" text-anchor="middle" class="tiny">exchanged server-side</text>

  <!-- Bottom Row -->
  <rect x="64" y="444" width="1472" height="236" rx="30" fill="#f7fbff" stroke="#3b82f6" stroke-dasharray="13 11" stroke-width="2.5"/>
  <text x="96" y="486" class="label" fill="#1d4ed8">STEP 5 · LONG-LIVED TOKEN, IDS &amp; WEBHOOK VERIFICATION</text>

  <rect class="box" x="104" y="518" width="420" height="126" rx="22" fill="#fff" stroke="#6366f1"/>
  <text x="314" y="562" text-anchor="middle" class="label" fill="#4338ca">fb_exchange_token → 60d Token</text>
  <text x="314" y="598" text-anchor="middle" class="body">refresh before expiry (&lt;7 days left)</text>

  <path class="arrow" d="M528 581 L604 581"/>

  <rect class="box" x="612" y="518" width="420" height="126" rx="22" fill="#fff" stroke="#16a34a"/>
  <text x="822" y="562" text-anchor="middle" class="label" fill="#15803d">debug_token → WABA + Phone ID</text>
  <text x="822" y="598" text-anchor="middle" class="body">persisted in Prisma Account table</text>

  <path class="arrow" d="M1036 581 L1112 581"/>

  <rect class="box" x="1120" y="518" width="376" height="126" rx="22" fill="#ecfdf5" stroke="#059669"/>
  <text x="1308" y="562" text-anchor="middle" class="label" fill="#065f46">Signed Webhooks</text>
  <text x="1308" y="598" text-anchor="middle" class="body">Verify x-hub-signature-256</text>
</svg>